F1 = 0.6901
F2 = 0.06517
F3 = 68.81
F4 = 0.4151
F5 = 112.8
F6 = 0.4381674

# environmental stochasticity
sigmaf = 0.4858775;

# effort dynamics and employment
q = 2.83e-6  	# scaling parameter relating to catchability and density
dsea = 0.01953203 # 0.054  # Required Person-years per vessel day
dmax = 30000e20  # max available person-years
dshr = 5.170907e-06 # 0.000004  # FTE/kg
b = 0.75  	# density dependence

# revenue and profit 
price_sea = 20.21291 # 13.13  	# landing price NOK/kg
price_shore = 30.14407 # 17.0  	# selling price NOK/kg
